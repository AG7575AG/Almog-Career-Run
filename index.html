<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Almog Ginsberg - Career Run</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f3f2f1;display:flex;flex-direction:column;align-items:center;padding:24px 16px 32px;font-family:'Segoe UI',Arial,sans-serif}
#hud{display:flex;gap:2rem;font-size:14px;color:#605e5c;margin-bottom:10px}
#hud b{font-size:16px;font-weight:700;color:#1b1b1b}
canvas{display:block;border-radius:6px;box-shadow:0 4px 24px rgba(0,0,0,0.18);max-width:100%}
#ab{width:100%;max-width:520px;margin-top:12px;background:#fff;border-radius:4px;border-left:4px solid #0078D4;padding:12px 18px;min-height:64px;transition:background .25s;box-shadow:0 1px 4px rgba(0,0,0,0.08)}
#at{font-size:13.5px;font-weight:400;color:#a19f9d;margin:0 0 4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#ad{font-size:13px;color:#323130;line-height:1.55;margin:0}
#ctrl{font-size:11.5px;color:#a19f9d;text-align:center;margin-top:8px}
</style>
</head>
<body>
<div id="hud">
  <div>Score <b id="sc">0</b></div>
  <div>Lives <b id="lv">♥♥♥</b></div>
  <div>Achievements <b id="ac">0/20</b></div>
</div>
<canvas id="c" width="520" height="400"></canvas>
<div id="ab"><p id="at">Collect achievement coins to see them here...</p><p id="ad"></p></div>
<div id="ctrl">Arrow keys / WASD to move &nbsp;·&nbsp; Space or Up to jump &nbsp;·&nbsp; Stomp enemies from above</div>
<script>
var W=520,H=400,GND=370,WW=3900;
var GRAV=0.5,JF=-13.5,SPD=4.5;
var cv=document.getElementById('c'),ctx=cv.getContext('2d');

var ACHS=[
 {e:'🏆',l:'Sales Club Winner 2025',p:80,d:"Recognised as a top global performer at Taboola for outstanding revenue impact and consistent overachievement across EMEA."},
 {e:'💰',l:'$7M+ iGaming Pipeline',p:90,d:"Built Taboola's iGaming business - identified the opportunity, pitched to leadership, and generated a $7M+ pipeline within 4 months."},
 {e:'📈',l:'$57M Total Advertiser Spend',p:100,d:"Scaled accounts from initial test budgets to seven-figure annual partnerships. $6.5M net new revenue expanding to $57M+ in total advertiser spend."},
 {e:'🤖',l:'AI Creative Strategy Agent',p:70,d:"Built an autonomous agent that conducts market research, identifies pain points, selects winning angles, and outputs full creative packages ready for launch."},
 {e:'⚡',l:'70% Faster Client Onboarding',p:60,d:"Reduced onboarding time by ~70% by deploying an AI agent that auto-generates precise all-in-one requirement emails - saving hours of back-and-forth per client."},
 {e:'🤝',l:'$3M+ Ecom Club Revenue',p:75,d:"Founded the Ecom Club, onboarded closed D2C communities and hosted an exclusive global event generating $3M+ in partnership-led revenue within 60 days."},
 {e:'🌍',l:'iGaming Vertical Launch',p:85,d:"Led the full go-to-market for Taboola's iGaming vertical. Aligned Legal, Policy, Product and Finance, and educated the Sales team on the new vertical."},
 {e:'🔄',l:'AM Handover AI Agent',p:55,d:"Built an AI agent that analyses live campaign data, flags performance anomalies and technical bugs (Pixel/S2S), and generates a structured handover brief for Account Managers to act on immediately."},
 {e:'🎯',l:'EMEA iGaming Playbook',p:65,d:"Created and delivered the iGaming sales playbook to the entire EMEA sales team - covering positioning, objection handling, and commercial strategy."},
 {e:'🌐',l:'International Conference Deals',p:60,d:"Represented Taboola at major global advertising conferences, sourcing and closing high-value enterprise accounts face-to-face with key industry decision-makers."},
 {e:'🔗',l:'C-Level Relationship Building',p:60,d:"Built direct long-term relationships with Founders, CMOs, and Heads of Growth - creating partnerships that drove sustained advertiser spend growth over time."},
 {e:'🚀',l:'Full-Cycle Hunter Role',p:55,d:"Owned the complete deal lifecycle: outreach, pitching, onboarding, optimisation, and expansion - turning early accounts into long-term top-spending partners."},
 {e:'📋',l:'Account Growth Manager',p:50,d:"Managed and grew an existing portfolio of advertisers, identifying upsell opportunities and unlocking scale through data-driven funnel analysis and consultative strategy."},
 {e:'📊',l:'D2C, iGaming & Finance Expert',p:50,d:"Scaled advertiser portfolios across 3 high-value verticals - D2C, iGaming, and Finance - turning test budgets into seven-figure annual partnerships, contributing to $57M+ in total managed spend."},
 {e:'🏗️',l:"Built WIDER's Sales Function",p:70,d:"Established WIDER's entire sales operation from zero - running outbound campaigns and closing high-value clients through personal network and referrals."},
 {e:'📲',l:'TikTok Partnership',p:85,d:"Secured a landmark partnership with TikTok where they actively source clients and fund the pilot - one of the first deals of its kind in the space."},
 {e:'💄',l:'$108K Cosmetics Case Study',p:90,d:"Spotted a blind spot in a $1M+ DTC ad account - reaction videos were winning across the category and the brand ran zero. Built 50 AI avatar creatives in iterative batches. Result: $108K in spend at 28% lower CPM, and one hero ad driving 592 purchases at a CPA 25% below the rest of the account."},
 {e:'🧠',l:'WIDER Intelligence Layer',p:65,d:"Built WIDER's internal AI infrastructure from scratch - a connected stack of competitor research pipelines, trend tracking tools, and a performance scoring framework that turned ad account audits from guesswork into a repeatable, data-backed process."},
 {e:'📉',l:'Performance Scoring System',p:50,d:"Established an internal scoring framework to audit ad accounts and provide clear, data-backed explanations of why specific creatives win or lose."},
 {e:'🔬',l:'Automated Market Research',p:55,d:"Cut research time per creative brief from hours to minutes - automated workflows pull live competitor ads, audience signals and trending hooks, and surface the exact pain points that go directly into scripts and production briefs."}
];

var PL=[
 [0,GND,WW],
 [150,308,110],[315,272,90],[465,308,100],[608,245,130],
 [768,300,90],[902,268,92],[1040,235,90],[1175,295,108],
 [1318,258,90],[1460,225,108],[1605,295,90],[1738,260,92],
 [1878,225,90],[2018,280,102],[2158,248,90],[2298,215,96],
 [2442,275,90],[2582,242,96],[2725,208,115],[2880,260,100],
 [3080,GND,680]
];

var TOTAL=20,state='start',score=0,lives=3,coll=0,fc=0,camX=0;
var P={},coins=[],enems=[];

function initLevel(){
 coins=PL.slice(1,21).map(function(p,i){return{wx:p[0]+p[2]/2,wy:p[1]-33,a:ACHS[i],got:false,ph:i*0.38};});
 enems=[
  {wx:560,wy:GND,vx:-1.5,mn:440,mx:690,ok:true,dt:0},
  {wx:920,wy:GND,vx:1.5,mn:820,mx:1050,ok:true,dt:0},
  {wx:1270,wy:GND,vx:-1.5,mn:1150,mx:1380,ok:true,dt:0},
  {wx:1840,wy:GND,vx:1.5,mn:1730,mx:1970,ok:true,dt:0},
  {wx:2430,wy:GND,vx:-1.5,mn:2310,mx:2540,ok:true,dt:0},
  {wx:2950,wy:GND,vx:1.5,mn:2850,mx:3060,ok:true,dt:0}
 ];
}

function rp(){P={x:62,y:GND-32,w:24,h:32,vx:0,vy:0,gr:false,face:1,inv:0,jh:false};camX=0;}
var K={};
document.addEventListener('keydown',function(e){K[e.key]=true;if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key))e.preventDefault();});
document.addEventListener('keyup',function(e){K[e.key]=false;});

function update(){
 if(state!=='playing')return;fc++;
 var L=K.ArrowLeft||K.a,R=K.ArrowRight||K.d,Ju=K.ArrowUp||K.w||K[' '];
 var jp=Ju&&!P.jh;P.jh=Ju;
 if(L){P.vx=-SPD;P.face=-1;}else if(R){P.vx=SPD;P.face=1;}else P.vx*=0.72;
 if(jp&&P.gr){P.vy=JF;P.gr=false;}
 P.vy=Math.min(P.vy+GRAV,15);P.y+=P.vy;P.x=Math.max(0,Math.min(P.x+P.vx,WW-P.w));
 P.gr=false;
 for(var i=0;i<PL.length;i++){
  var pl=PL[i];if(P.x+P.w<=pl[0]||P.x>=pl[0]+pl[2])continue;
  var pb=P.y+P.h-P.vy,cb=P.y+P.h;
  if(P.vy>=0&&pb<=pl[1]+1&&cb>=pl[1]){P.y=pl[1]-P.h;P.vy=0;P.gr=true;break;}
 }
 if(P.y>H+100)diePl();
 if(P.inv>0)P.inv--;
 for(var j=0;j<enems.length;j++){
  var e=enems[j];if(!e.ok){e.dt++;continue;}
  e.wx+=e.vx;if(e.wx<e.mn||e.wx>e.mx)e.vx=-e.vx;
  var ex=e.wx-12,ey=e.wy-28;
  if(P.inv===0&&P.x+P.w>ex&&P.x<ex+24&&P.y+P.h>ey&&P.y<ey+28){
   if(P.vy>0&&P.y+P.h<ey+16){e.ok=false;e.dt=0;P.vy=JF*0.55;score+=200;upHUD();}
   else diePl();
  }
 }
 for(var k=0;k<coins.length;k++){
  var c=coins[k];if(c.got)continue;
  if(Math.abs(P.x+12-c.wx)<22&&Math.abs(P.y+16-c.wy)<24){
   c.got=true;coll++;score+=c.a.p;showAch(c.a);upHUD();
   if(coll===TOTAL)setTimeout(function(){state='win';},800);
  }
 }
 if(P.x>WW-740)state='win';
 camX+=(P.x-W/3-camX)*0.1;camX=Math.max(0,Math.min(camX,WW-W));
}

function diePl(){
 if(P.inv>0)return;lives--;upHUD();
 if(lives<=0){state='gameover';return;}
 rp();P.inv=90;
}

function upHUD(){
 document.getElementById('sc').textContent=score;
 document.getElementById('lv').textContent='♥'.repeat(Math.max(0,lives))+'♡'.repeat(Math.max(0,3-lives));
 document.getElementById('ac').textContent=coll+'/'+TOTAL;
}

function showAch(a){
 var at=document.getElementById('at'),ad=document.getElementById('ad'),ab=document.getElementById('ab');
 at.style.fontWeight='600';at.style.color='#1b1b1b';
 at.innerHTML=a.e+' <strong style="color:#1b1b1b">'+a.l+'</strong> <span style="font-size:11px;color:#a19f9d;font-weight:400">+'+a.p+' pts</span>';
 ad.style.color='#323130';ad.textContent=a.d;
 ab.style.background='#deecf9';setTimeout(function(){ab.style.background='#fff';},500);
}

function dBG(){
 var g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#090f1f');g.addColorStop(1,'#142d5c');
 ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 ctx.fillStyle='rgba(255,255,255,0.7)';
 for(var i=0;i<50;i++){var sx=(i*173+7)%W,sy=(i*97+3)%220,sz=(Math.sin(fc*0.018+i)*0.5+0.5)*1.4+0.3;ctx.beginPath();ctx.arc(sx,sy,sz,0,6.28);ctx.fill();}
 ctx.fillStyle='rgba(255,255,255,0.03)';
 var boff=(-camX*0.15)%220;
 for(var b=Math.floor((-camX*0.15)/220)*220;b<W+220;b+=220){
  var bx=b+boff%220;
  ctx.fillRect(bx,GND-90,80,90);ctx.fillRect(bx+90,GND-60,70,60);ctx.fillRect(bx+165,GND-110,55,110);
  ctx.fillStyle='rgba(255,200,50,0.12)';
  for(var wy2=GND-82;wy2<GND-10;wy2+=18)for(var wx2=bx+8;wx2<bx+72;wx2+=20)ctx.fillRect(wx2,wy2,10,10);
  ctx.fillStyle='rgba(255,255,255,0.03)';
 }
}

function dPlats(){
 for(var i=0;i<PL.length;i++){
  var p=PL[i],sx=p[0]-camX;if(sx>W+4||sx+p[2]<-4)continue;
  if(p[1]===GND){
   ctx.fillStyle='#1a3d0e';ctx.fillRect(sx,p[1],p[2],H-p[1]+4);
   ctx.fillStyle='#2d6118';ctx.fillRect(sx,p[1],p[2],10);
   ctx.fillStyle='#3d8020';ctx.fillRect(sx,p[1],p[2],3);
  }else{
   ctx.fillStyle='#7b4a1e';ctx.fillRect(sx,p[1],p[2],13);
   ctx.fillStyle='#a06832';ctx.fillRect(sx,p[1],p[2],4);
   ctx.strokeStyle='rgba(0,0,0,0.22)';ctx.lineWidth=1;
   for(var bx=sx;bx<sx+p[2];bx+=20){ctx.beginPath();ctx.moveTo(bx,p[1]);ctx.lineTo(bx,p[1]+13);ctx.stroke();}
   ctx.beginPath();ctx.moveTo(sx,p[1]+7);ctx.lineTo(sx+p[2],p[1]+7);ctx.strokeStyle='rgba(0,0,0,0.18)';ctx.stroke();
  }
 }
}

function dCoins(){
 ctx.textAlign='center';ctx.textBaseline='middle';
 for(var i=0;i<coins.length;i++){
  var c=coins[i];if(c.got)continue;
  var sx=c.wx-camX;if(sx<-30||sx>W+30)continue;
  var cy=c.wy+Math.sin(fc*0.065+c.ph)*5;
  ctx.save();
  ctx.globalAlpha=0.28;ctx.fillStyle='#FFD700';ctx.beginPath();ctx.arc(sx,cy,22,0,6.28);ctx.fill();
  ctx.globalAlpha=1;ctx.fillStyle='#FFD700';ctx.strokeStyle='#E8A000';ctx.lineWidth=2.5;
  ctx.beginPath();ctx.arc(sx,cy,14,0,6.28);ctx.fill();ctx.stroke();
  ctx.font='13px serif';ctx.fillText(c.a.e,sx,cy);ctx.restore();
 }
}

function dEnems(){
 for(var i=0;i<enems.length;i++){
  var e=enems[i],sx=e.wx-12-camX,sy=e.wy-28;
  if(!e.ok){if(e.dt<22){ctx.fillStyle='#D13438';ctx.fillRect(sx,sy+20,24,8);}continue;}
  if(sx>W+20||sx+24<-20)continue;
  ctx.fillStyle='#C11F23';ctx.beginPath();ctx.ellipse(sx+12,sy+14,12,14,0,0,6.28);ctx.fill();
  ctx.fillStyle='#fff';ctx.fillRect(sx+3,sy+6,6,6);ctx.fillRect(sx+15,sy+6,6,6);
  ctx.fillStyle='#111';ctx.fillRect(sx+5,sy+8,4,4);ctx.fillRect(sx+15,sy+8,4,4);
  ctx.strokeStyle='#111';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(sx+2,sy+5);ctx.lineTo(sx+9,sy+8);ctx.stroke();
  ctx.beginPath();ctx.moveTo(sx+22,sy+5);ctx.lineTo(sx+15,sy+8);ctx.stroke();
  var st=Math.floor(fc/8)%2;ctx.fillStyle='#8B0000';
  ctx.fillRect(sx+(st?3:1),sy+24,9,5);ctx.fillRect(sx+(st?13:15),sy+24,9,5);
 }
}

function dPlayer(){
 if(P.inv>0&&Math.floor(fc/4)%2)return;
 var sx=P.x-camX,sy=P.y;
 ctx.save();ctx.translate(sx+12,sy);ctx.scale(P.face,1);
 ctx.fillStyle='#003a6b';ctx.fillRect(-10,0,20,9);ctx.fillRect(-13,7,26,5);
 ctx.fillStyle='#fff';ctx.font='bold 7px Arial';ctx.textAlign='center';ctx.textBaseline='top';ctx.fillText('M',-1,1);
 ctx.fillStyle='#f5c5a3';ctx.fillRect(-8,11,16,12);
 ctx.fillStyle='#333';ctx.fillRect(-6,13,4,4);ctx.fillRect(2,13,4,4);
 ctx.fillStyle='#5c3320';ctx.fillRect(-7,19,14,3);
 ctx.fillStyle='#0078D4';ctx.fillRect(-9,22,18,12);
 var mv=Math.abs(P.vx)>0.4&&P.gr,st=Math.floor(fc/5)%2;
 ctx.fillStyle='#111';ctx.fillRect(-9,32,8,mv&&st?9:7);ctx.fillRect(1,32,8,mv&&!st?9:7);
 ctx.fillStyle='#3d2b1f';ctx.fillRect(-10,mv&&st?39:37,11,4);ctx.fillRect(1,mv&&!st?39:37,11,4);
 ctx.restore();
}

function dFlag(){
 var sx=3380-camX;if(sx>W+10||sx<-50)return;
 ctx.fillStyle='#999';ctx.fillRect(sx,GND-135,4,135);
 ctx.fillStyle='#0078D4';ctx.fillRect(sx+4,GND-135,38,24);
 var fx=sx+7,fy=GND-133;
 ctx.fillStyle='#F25022';ctx.fillRect(fx,fy,13,10);ctx.fillStyle='#7FBA00';ctx.fillRect(fx+14,fy,13,10);
 ctx.fillStyle='#00A4EF';ctx.fillRect(fx,fy+11,13,10);ctx.fillStyle='#FFB900';ctx.fillRect(fx+14,fy+11,13,10);
 ctx.fillStyle='rgba(255,255,255,0.8)';ctx.font='bold 10px Segoe UI,sans-serif';ctx.textAlign='center';ctx.fillText('GOAL',sx+2,GND-6);
}

function dMSLogo(x,y,s){
 var h=Math.floor(s/2)-1;
 ctx.fillStyle='#F25022';ctx.fillRect(x,y,h,h);ctx.fillStyle='#7FBA00';ctx.fillRect(x+h+2,y,h,h);
 ctx.fillStyle='#00A4EF';ctx.fillRect(x,y+h+2,h,h);ctx.fillStyle='#FFB900';ctx.fillRect(x+h+2,y+h+2,h,h);
}

function dOverlay(){
 if(state==='playing')return;
 ctx.fillStyle='rgba(0,0,0,0.82)';ctx.fillRect(0,0,W,H);ctx.textAlign='center';
 if(state==='start'){
  ctx.fillStyle='#0078D4';ctx.fillRect(0,0,W,72);
  dMSLogo(22,21,28);
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 17px Segoe UI,sans-serif';ctx.fillText('Almog Ginsberg',62,35);
  ctx.fillStyle='#c7e0f4';ctx.font='12px Segoe UI,sans-serif';ctx.fillText('Senior Growth & Creative Strategy - London, UK',62,52);
  var stats=[[100,'$57M+','total ad spend'],[260,'$7M+','iGaming pipeline'],[420,'70%','faster onboarding']];
  for(var i=0;i<stats.length;i++){
   ctx.fillStyle='rgba(255,255,255,0.08)';ctx.fillRect(stats[i][0]-60,88,120,64);
   ctx.fillStyle='#0078D4';ctx.font='bold 22px Segoe UI,sans-serif';ctx.textAlign='center';ctx.fillText(stats[i][1],stats[i][0],122);
   ctx.fillStyle='rgba(255,255,255,0.6)';ctx.font='11px Segoe UI,sans-serif';ctx.fillText(stats[i][2],stats[i][0],144);
  }
  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.82)';ctx.font='13px Segoe UI,sans-serif';
  ctx.fillText('Collect all 20 career achievements. Stomp enemies to defeat them.',W/2,192);
  ctx.fillText('Reach the Microsoft flag at the end to win!',W/2,211);
  ctx.fillStyle='#0078D4';ctx.fillRect(W/2-85,230,170,40);
  ctx.fillStyle='#fff';ctx.font='bold 14px Segoe UI,sans-serif';ctx.fillText('Play Career Run',W/2,254);
  ctx.fillStyle='rgba(255,255,255,0.35)';ctx.font='11px Segoe UI,sans-serif';ctx.fillText('Arrow keys / WASD - Space or Up to jump',W/2,300);
 } else if(state==='gameover'){
  ctx.fillStyle='#fff';ctx.font='bold 26px Segoe UI,sans-serif';ctx.fillText('Game Over',W/2,H/2-48);
  ctx.fillStyle='rgba(255,255,255,0.7)';ctx.font='14px Segoe UI,sans-serif';ctx.fillText('Score: '+score+'   Achievements: '+coll+'/'+TOTAL,W/2,H/2-18);
  ctx.fillStyle='#0078D4';ctx.fillRect(W/2-78,H/2+10,156,40);
  ctx.fillStyle='#fff';ctx.font='bold 14px Segoe UI,sans-serif';ctx.fillText('Try Again',W/2,H/2+34);
 } else if(state==='win'){
  dMSLogo(W/2-18,42,36);
  ctx.fillStyle='#fff';ctx.font='bold 24px Segoe UI,sans-serif';ctx.fillText('Level Complete!',W/2,110);
  ctx.fillStyle='rgba(255,255,255,0.7)';ctx.font='13px Segoe UI,sans-serif';ctx.fillText(coll+' achievements collected   Final Score: '+score,W/2,135);
  ctx.fillStyle='rgba(255,255,255,0.08)';ctx.fillRect(55,152,W-110,55);
  ctx.fillStyle='rgba(255,255,255,0.82)';ctx.font='13px Segoe UI,sans-serif';
  ctx.fillText('Every milestone here is a real, measurable result.',W/2,180);ctx.fillText('Ready to bring this energy to Microsoft Advertising.',W/2,200);
  ctx.fillStyle='rgba(255,255,255,0.9)';ctx.fillRect(W/2-72,225,144,38);
  ctx.fillStyle='#0078D4';ctx.font='bold 14px Segoe UI,sans-serif';ctx.fillText('Play Again',W/2,248);
  ctx.fillStyle='rgba(255,255,255,0.15)';ctx.fillRect(W/2-72,275,144,34);
  ctx.fillStyle='#fff';ctx.font='13px Segoe UI,sans-serif';ctx.fillText('View LinkedIn',W/2,296);
 }
}

function loop(){update();dBG();dPlats();dFlag();dCoins();dEnems();if(state==='playing')dPlayer();dOverlay();requestAnimationFrame(loop);}

cv.addEventListener('click',function(e){
 var r=cv.getBoundingClientRect(),cx=(e.clientX-r.left)*(W/r.width),cy=(e.clientY-r.top)*(H/r.height);
 function restart(){initLevel();rp();score=0;lives=3;coll=0;upHUD();state='playing';}
 if(state==='start'&&cx>W/2-85&&cx<W/2+85&&cy>230&&cy<270)restart();
 if(state==='gameover'&&cx>W/2-78&&cx<W/2+78&&cy>H/2+10&&cy<H/2+50)restart();
 if(state==='win'){
  if(cx>W/2-72&&cx<W/2+72&&cy>225&&cy<263)restart();
  if(cx>W/2-72&&cx<W/2+72&&cy>275&&cy<309)window.open('https://www.linkedin.com/in/almogginsberg','_blank');
 }
});

upHUD();initLevel();loop();
</script>
</body>
</html>
